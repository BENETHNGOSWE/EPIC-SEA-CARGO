server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS is terminated in front (Coolify/Traefik + Cloudflare), so plain HTTP is expected.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # content-addressed by rebuild: name changes when the file changes, so cache hard
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2|woff|ttf|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # /about -> /about/ so relative ../ assets keep working
    rewrite ^/([a-z0-9-]+[^./]*)$ /$1/ permanent;
    error_page 404 /404.html;
}
