# No build, no image to create, no PHP: stock nginx reading a folder of files.
#
# Coolify: New Resource -> Deploy from Git -> repo BENETHNGOSWE/EPIC-SEA-CARGO -> branch
# `deploy` -> Build Pack = Docker Compose -> Compose location `docker-compose.yml`. Leave the
# Domains field EMPTY: the Traefik labels below already route epicseacargo.com, and filling it
# in would create a second router for the same host.
#
# Prerequisite, once, on the VPS (Coolify mounts this folder, it does not create it):
#   sudo git clone --depth 1 -b deploy https://github.com/BENETHNGOSWE/EPIC-SEA-CARGO.git /var/www/epic
# Update the site afterwards (no redeploy, no rebuild):
#   sudo git -C /var/www/epic fetch --depth 1 origin deploy && sudo git -C /var/www/epic reset --hard origin/deploy
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - /var/www/epic:/usr/share/nginx/html:ro
      - /var/www/epic/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.epic.rule=Host(`epicseacargo.com`) || Host(`www.epicseacargo.com`)"
      - "traefik.http.routers.epic.entrypoints=websecure"
      - "traefik.http.routers.epic.tls=true"
      - "traefik.http.routers.epic.tls.certresolver=letsencrypt"
      - "traefik.http.services.epic.loadbalancer.server.port=80"
      - "traefik.http.routers.epic-http.rule=Host(`epicseacargo.com`) || Host(`www.epicseacargo.com`)"
      - "traefik.http.routers.epic-http.entrypoints=web"
      - "traefik.http.routers.epic-http.middlewares=epic-https"
      - "traefik.http.middlewares.epic-https.redirectscheme.scheme=https"
# No `ports:` on purpose - publishing 80 here would fight Coolify's own proxy on the host.
# Traefik reaches the container over the `coolify` network instead.
networks:
  coolify:
    external: true
